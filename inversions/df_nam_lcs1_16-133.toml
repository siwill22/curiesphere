# DF-NAM: the provinces of North America, each with its own mean and fractal pattern (as DF-AUS), with the ring error, ranked
# against one domain. Not sampled and no Laplace s.d. (the continent is several times larger than Australia; each
# evaluation costs ~50 times more)
inherit = "nam_lcs1_16-133.toml"

[errors]
weighting = "full"
model_error = { rms_nT = 0.0 }

[parameterisation]
kind = "domains"
table = "domains/nam_domains.csv"

[method]
name = "df"
bounds = [0.0, 4.0]
beta_range = [2.0, 3.0]
ell_range = [50.0, 5000.0]
s_range = [0.01, 10.0]
noise = "fixed"
layouts = { one = true }
ring_error = { beyond_km = 50.0 }
hyper_sd = false
