# CM-AUS: cell map of Australia from LCS-1, degrees 16-133, with the settings of the first Australian build
# (notebooks/regions/australia, run_linear_models.py and run_map_sweep.py): the error model of LCS-1 - MF7 noise
# at its RMS over the points, model error with the field's own spectrum at 33.4 nT (from that build's reference
# fit), compressed with the 'subspace' weighting.
mode = "final"

[target]
area = "outlines/australia.gpkg"
nside = 64

[geometry]
layers = [{ top = "basement", base = 30.0 }]
direction = "induced_igrf13"
lmax = 185

[fit]
type = "local"
buffer_km = 300.0
data_nside = 128
background = { vis_model = "Hemant2005+slabs", remanence = "GK07", near_ridge = true }

[data]
model = "lcs1"
band = [16, 133]
filter = "lcs1"

[errors]
weighting = "subspace"
keep = 0.999
noise = { reference = "mf7", rms_nT = "points" }
model_error = { spectrum = "field", rms_nT = 33.4 }

[method]
name = "cm"
length = "evidence"
reference = "hm_mean"
bounds = [0.0, inf]
maps = [
    { label = "l2", penalty = "l2", length = "gmrf", beta = "discrepancy" },
    { label = "tv", penalty = "tv", length = "gmrf", beta = "discrepancy" },
    { label = "l2_200km", penalty = "l2", length = 200.0, beta = "discrepancy" },
]
