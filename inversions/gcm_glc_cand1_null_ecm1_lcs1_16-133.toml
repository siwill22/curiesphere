# Spin test for the candidate map ecm1: its units on each continent turned by a random angle about the
# continent's centre (20 draws, the same angles as rotated_provinces), then the same patch rule. Does the real map
# beat its spun copies?
inherit = "gcm_glc_layouts_oc_lcs1_16-133.toml"

[errors.background]
rms_nT = [16.0]

[method]
layouts = ["rotated_cand:ecm1:0", "rotated_cand:ecm1:1", "rotated_cand:ecm1:2", "rotated_cand:ecm1:3", "rotated_cand:ecm1:4", "rotated_cand:ecm1:5", "rotated_cand:ecm1:6", "rotated_cand:ecm1:7", "rotated_cand:ecm1:8", "rotated_cand:ecm1:9", "rotated_cand:ecm1:10", "rotated_cand:ecm1:11", "rotated_cand:ecm1:12", "rotated_cand:ecm1:13", "rotated_cand:ecm1:14", "rotated_cand:ecm1:15", "rotated_cand:ecm1:16", "rotated_cand:ecm1:17", "rotated_cand:ecm1:18", "rotated_cand:ecm1:19"]
