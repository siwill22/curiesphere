# Spin test for the candidate map nrcan: its units on each continent turned by a random angle about the
# continent's centre (20 draws, the same angles as rotated_provinces), then the same patch rule. Does the real map
# beat its spun copies?
inherit = "gcm_glc_layouts_oc_lcs1_16-133.toml"

[errors.background]
rms_nT = [16.0]

[method]
layouts = ["rotated_cand:nrcan:0", "rotated_cand:nrcan:1", "rotated_cand:nrcan:2", "rotated_cand:nrcan:3", "rotated_cand:nrcan:4", "rotated_cand:nrcan:5", "rotated_cand:nrcan:6", "rotated_cand:nrcan:7", "rotated_cand:nrcan:8", "rotated_cand:nrcan:9", "rotated_cand:nrcan:10", "rotated_cand:nrcan:11", "rotated_cand:nrcan:12", "rotated_cand:nrcan:13", "rotated_cand:nrcan:14", "rotated_cand:nrcan:15", "rotated_cand:nrcan:16", "rotated_cand:nrcan:17", "rotated_cand:nrcan:18", "rotated_cand:nrcan:19"]
