# Spin test for the candidate map cgmw: its units on each continent turned by a random angle about the
# continent's centre (20 draws, the same angles as rotated_provinces), then the same patch rule. Does the real map
# beat its spun copies?
inherit = "gcm_glc_layouts_oc_lcs1_16-133.toml"

[errors.background]
rms_nT = [16.0]

[method]
layouts = ["rotated_cand:cgmw:0", "rotated_cand:cgmw:1", "rotated_cand:cgmw:2", "rotated_cand:cgmw:3", "rotated_cand:cgmw:4", "rotated_cand:cgmw:5", "rotated_cand:cgmw:6", "rotated_cand:cgmw:7", "rotated_cand:cgmw:8", "rotated_cand:cgmw:9", "rotated_cand:cgmw:10", "rotated_cand:cgmw:11", "rotated_cand:cgmw:12", "rotated_cand:cgmw:13", "rotated_cand:cgmw:14", "rotated_cand:cgmw:15", "rotated_cand:cgmw:16", "rotated_cand:cgmw:17", "rotated_cand:cgmw:18", "rotated_cand:cgmw:19"]
