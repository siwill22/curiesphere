# GCM-GLC with layouts on synthetic data (docs/experiment-global-layouts.md). S2: group levels drawn with the spread fitted to LCS-1 (0.21 SI km about 0.715); groups should win, provinces not beat them.
# One seeded noise draw at the measured noise level, plus an ocean-model error (HM05 in the truth, GK07 fitted).
inherit = "gcm_glc_layouts_lcs1_16-133.toml"

