# DF-AUS with GCM-GLC as the background on the continental crust outside the target (instead of H&M + slabs); the oceans
# keep the ocean model, as in GCM's own fit
inherit = "df_aus_lcs1_16-133.toml"

[fit.background]
outside = "results/gcm_glc_lcs1_16-133.nc"

# as the other continents' DF runs: no sampling, no beta profile, no merge layout
[method]
layouts = { one = true, merge = false }
sample = { steps = 0 }
beta_profile = []
hyper_sd = false
