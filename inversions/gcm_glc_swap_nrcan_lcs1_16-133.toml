# Per-continent comparison of the candidate map nrcan with the Hasterok provinces: on each continent in turn the
# candidate's units replace the provinces, Hasterok elsewhere. The change of the global evidence from cand:hasterok
# is that continent's share of the difference between the two maps.
inherit = "gcm_glc_layouts_oc_lcs1_16-133.toml"

[errors.background]
rms_nT = [16.0]

[method]
layouts = ["one", "cand:hasterok", "swap:nrcan:afr", "swap:nrcan:ant", "swap:nrcan:aus", "swap:nrcan:eur", "swap:nrcan:nam", "swap:nrcan:sam", "swap:nrcan:zea"]
