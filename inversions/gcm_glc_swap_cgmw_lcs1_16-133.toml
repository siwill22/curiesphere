# Per-continent comparison of the candidate map cgmw with the Hasterok provinces: on each continent in turn the
# candidate's units replace the provinces, Hasterok elsewhere. The change of the global evidence from cand:hasterok
# is that continent's share of the difference between the two maps.
inherit = "gcm_glc_layouts_oc_lcs1_16-133.toml"

[errors.background]
rms_nT = [16.0]

[method]
layouts = ["one", "cand:hasterok", "swap:cgmw:afr", "swap:cgmw:ant", "swap:cgmw:aus", "swap:cgmw:eur", "swap:cgmw:nam", "swap:cgmw:sam", "swap:cgmw:zea"]
