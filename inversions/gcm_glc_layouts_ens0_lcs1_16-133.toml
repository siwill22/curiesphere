# Ensemble of geology-blind controls for the provinces (draws 0-16): random Voronoi tilings with as many tiles
# as provinces, and the provinces of each continent spun by a random angle about the continent's centre (spin test).
# Ocean-model error at the chosen 16 nT (decomposition cached), noise fixed. Do the polygons beat every random draw?
inherit = "gcm_glc_layouts_oc_lcs1_16-133.toml"

[errors.background]
rms_nT = [16.0]

