# Per-continent comparison of the candidate map merdith with the Hasterok provinces: on each continent in turn the
# candidate's units replace the provinces, Hasterok elsewhere. The change of the global evidence from cand:hasterok
# is that continent's share of the difference between the two maps.
inherit = "gcm_glc_layouts_oc_lcs1_16-133.toml"

[errors.background]
rms_nT = [16.0]

[method]
layouts = ["one", "cand:hasterok", "swap:merdith:afr", "swap:merdith:ant", "swap:merdith:aus", "swap:merdith:eur", "swap:merdith:nam", "swap:merdith:sam", "swap:merdith:zea"]
