inherit = "gcm_glc_layouts_oc_syn_s5_ctrl.toml"

[errors.background]
rms_nT = [16.0]

[method]
layouts = ["one", "provinces", "cand:hasterok", "cand:sl2013_k4", "cand:sl2013_k6", "cand:sl2013_k8", "cand:sl2013_k12", "cand:tc1", "cand:ecm1", "cand:merdith"]
