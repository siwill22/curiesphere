# Baseline for "more domains give a better fit": 10 random Voronoi tilings of the continents with 1000 tiles each
# (seeds by area, blind to geology). With the other counts it gives the score random maps reach for a given number
# of domains, against which every candidate map is compared.
inherit = "gcm_glc_layouts_oc_lcs1_16-133.toml"

[errors.background]
rms_nT = [16.0]

[method]
layouts = ["one", "cand:hasterok", "voronoi_k1000:0", "voronoi_k1000:1", "voronoi_k1000:2", "voronoi_k1000:3", "voronoi_k1000:4", "voronoi_k1000:5", "voronoi_k1000:6", "voronoi_k1000:7", "voronoi_k1000:8", "voronoi_k1000:9"]
