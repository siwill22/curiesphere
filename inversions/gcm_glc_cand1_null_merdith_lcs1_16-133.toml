# Spin test for the candidate map merdith: its units on each continent turned by a random angle about the
# continent's centre (20 draws, the same angles as rotated_provinces), then the same patch rule. Does the real map
# beat its spun copies?
inherit = "gcm_glc_layouts_oc_lcs1_16-133.toml"

[errors.background]
rms_nT = [16.0]

[method]
layouts = ["rotated_cand:merdith:0", "rotated_cand:merdith:1", "rotated_cand:merdith:2", "rotated_cand:merdith:3", "rotated_cand:merdith:4", "rotated_cand:merdith:5", "rotated_cand:merdith:6", "rotated_cand:merdith:7", "rotated_cand:merdith:8", "rotated_cand:merdith:9", "rotated_cand:merdith:10", "rotated_cand:merdith:11", "rotated_cand:merdith:12", "rotated_cand:merdith:13", "rotated_cand:merdith:14", "rotated_cand:merdith:15", "rotated_cand:merdith:16", "rotated_cand:merdith:17", "rotated_cand:merdith:18", "rotated_cand:merdith:19"]
