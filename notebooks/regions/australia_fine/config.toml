# Australia on finer cells (stage 2 of the degree-range comparison): the same extent, data points and
# covariates as regions/australia, with ~50 km cells (NSIDE 128) so that degrees to 300 can be resolved.
# G straight from the cells' nodes (basis.cell_matrix_direct), no column files.
outline = "../australia/outline.gpkg"
nside_cell = 128         # ~50 km cells; the coarse basis is NSIDE 64
nside_data = 128         # data points, ~55 km (the same points as regions/australia; half-wavelength at degree 300: 67 km)
buffer_km = 300.0
base_depth_km = 30.0     # slab base below the ellipsoid
lmin = 16
lmax_fit = 133           # the first build: LCS-1 16-133, as regions/australia (isolates the effect of cell size)
lmax_cell = 133
columns = "direct"
n_noise = 100
seed = 20261001

# error model (error_model.py): model-error covariance with the spectral shape of LCS-1
model_error_shape = "lcs1"

# covariates (domains/covariates.py, run_covariates.py); '~' is expanded
[covariates]
moho = "~/Data/AuSREM-CM-moho/AusMoho2012.xyz"                  # columns lat, lon, Moho depth (km)
crust_fallback = "~/Data/Moho/crust1.0/crust1_CrustalThickness.nc"
lab = "~/Data/AuSREM-CM-moho/LAB.xyz"                            # columns lon, lat, depth (km)
lab_fallback = "~/Data/litho1.0/grids/litho1_LID-BOTTOM.nc"      # metres
heat_flow = "~/Library/CloudStorage/OneDrive-UniversityofTasmania/Data/Heatflow/HFgrid14.nc"

[covariates.heat_flow_alt]
seisheat = "~/GIT/SeisHeat/out/method1_grid.nc:q_bar"            # similarity method on SL2013sv
heatr = "~/GIT/Heatr/data/processed/heatflow_pred_13.nc:q_pred"

# degree bands and data models (build_bands.py), as in regions/australia; above degree 185 (LCS-1's last)
# the noise is held at the noise-to-signal ratio of degrees 150-185
[bands]
noise = "lcs1-2e"

[bands.models]                            # coefficients, and the filter applied to data, G and noise alike
lcs1 = { coeffs = "lcs1", filter = "lcs1" }
2e = { coeffs = "~/Library/CloudStorage/OneDrive-UniversityofTasmania/Data/StefanMausData/xDLFI/SW_OPER_MLI_SHA_2E_00000000T000000_99999999T999999_0901/SW_OPER_MLI_SHA_2E_00000000T000000_99999999T999999_0901.shc", filter = "none" }

[bands.runs]
lcs1_16-185 = { data = "lcs1", lmin = 16, lmax = 185 }
2e_16-185 = { data = "2e", lmin = 16, lmax = 185 }
2e_16-300 = { data = "2e", lmin = 16, lmax = 300 }
# future-data test (synthetic only; 2E geometry, no filter; compression on noise + signal): today's noise
# ('lcs1-2e') against future data whose noise is at most a fraction of the signal amplitude at every degree
syn_16-133 = { data = "2e", lmin = 16, lmax = 133, synthetic = true, compress = "signal" }
syn_16-185 = { data = "2e", lmin = 16, lmax = 185, synthetic = true, compress = "signal" }
syn_f10_16-133 = { data = "2e", lmin = 16, lmax = 133, synthetic = true, compress = "signal", noise_fraction = 0.1 }
syn_f10_16-185 = { data = "2e", lmin = 16, lmax = 185, synthetic = true, compress = "signal", noise_fraction = 0.1 }
syn_f10_16-300 = { data = "2e", lmin = 16, lmax = 300, synthetic = true, compress = "signal", noise_fraction = 0.1 }
syn_f30_16-300 = { data = "2e", lmin = 16, lmax = 300, synthetic = true, compress = "signal", noise_fraction = 0.3 }
